name: Auto Build & Release ReWrite

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      file_version: ${{ steps.version.outputs.file_version }}
      release_version: ${{ steps.version.outputs.release_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Generate release version
        id: version
        shell: bash
        run: |
          app_version="0.0.$(date -u +'%y%m%d')"
          file_version="0.0.$(date -u +'%y%j').${GITHUB_RUN_NUMBER}"
          release_version="${app_version}-build.${GITHUB_RUN_NUMBER}"
          tag="v${release_version}"

          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "file_version=${file_version}" >> "$GITHUB_OUTPUT"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          echo "App version: ${app_version}"
          echo "File version: ${file_version}"
          echo "Release version: ${release_version}"
          echo "Release tag: ${tag}"

  validate:
    name: Validate shared web assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Compile Tailwind CSS
        run: npm run build

      - name: Check JavaScript syntax
        run: |
          node --check Windows/SettingsWindow/settings.js
          node --check Windows/PopupWindow/popup.js

      - name: Check localization keys
        run: node scripts/check_locale_keys.js

  build-windows:
    name: Build Windows app
    runs-on: windows-latest
    needs:
      - prepare
      - validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Compile Tailwind CSS
        run: npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore .NET dependencies
        run: dotnet restore ReWrite.csproj

      - name: Publish portable Windows executable
        shell: pwsh
        run: |
          $appVersion = "${{ needs.prepare.outputs.app_version }}"
          $fileVersion = "${{ needs.prepare.outputs.file_version }}"
          $releaseVersion = "${{ needs.prepare.outputs.release_version }}"
          $informationalVersion = "${releaseVersion}+${{ github.sha }}"

          dotnet publish ReWrite.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o release `
            -p:Version=$appVersion `
            -p:FileVersion=$fileVersion `
            -p:InformationalVersion=$informationalVersion

          Rename-Item -Path "release/ReWrite.exe" -NewName "ReWrite-Portable-v$releaseVersion.exe"

      - name: Build Windows installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: ReWrite.iss
          options: /DAppVersion=${{ needs.prepare.outputs.release_version }} /Oinstaller /FReWrite-Setup-v${{ needs.prepare.outputs.release_version }}

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          $releaseVersion = "${{ needs.prepare.outputs.release_version }}"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "release/ReWrite-Portable-v$releaseVersion.exe" artifacts/
          Copy-Item "installer/ReWrite-Setup-v$releaseVersion.exe" artifacts/
          Get-ChildItem artifacts

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rewrite-windows-${{ needs.prepare.outputs.release_version }}
          path: artifacts/*
          if-no-files-found: error

  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    needs:
      - prepare
      - validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Compile Tailwind CSS
        run: npm run build

      - name: Build macOS app bundle
        shell: bash
        run: |
          chmod +x macos/build-app.sh
          cd macos
          VERSION="${{ needs.prepare.outputs.app_version }}" ./build-app.sh

      - name: Package macOS app
        shell: bash
        run: |
          release_version="${{ needs.prepare.outputs.release_version }}"
          mkdir -p macos/artifacts
          cd macos
          ditto -c -k --sequesterRsrc --keepParent "dist/ReWrite.app" "artifacts/ReWrite-macOS-v${release_version}.zip"
          ls -lh artifacts

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: rewrite-macos-${{ needs.prepare.outputs.release_version }}
          path: macos/artifacts/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-windows
      - build-macos
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Show release assets
        run: ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ReWrite ${{ needs.prepare.outputs.release_version }}
          body: |
            Automated release from `${{ github.ref_name }}` at commit `${{ github.sha }}`.

            Assets:
            - Windows portable executable
            - Windows installer
            - macOS app bundle ZIP (ad-hoc signed, not notarized)
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
