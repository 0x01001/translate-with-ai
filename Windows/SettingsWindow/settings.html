<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="title.settings">ReWrite Settings</title>
    <style>
        :root{
            --bg:#0F1115;
            --card:#11151a;
            --card-2:#0c1014;
            --line:rgba(255,255,255,0.06);
            --line-strong:rgba(255,255,255,0.1);
            --muted:#9AA4B2;
            --text:#E7EEF7;
            --accent1:#9333EA;
            --accent2:#4F46E5;
        }
        html,body{height:100%;margin:0;background:transparent;color:var(--text);font-family:Segoe UI,Roboto,system-ui,sans-serif;color-scheme:dark}
        body{overflow:hidden}
        .app-container{box-sizing:border-box;min-height:100vh;padding:18px;background:radial-gradient(circle at top left, rgba(147,51,234,0.15), transparent 26%), radial-gradient(circle at bottom right, rgba(79,70,229,0.12), transparent 28%), linear-gradient(180deg, rgba(15,17,21,0.98), rgba(10,11,12,0.94));}
        .shell{display:flex;flex-direction:column;gap:14px;max-width:720px;margin:0 auto}
        .header{display:flex;align-items:center;gap:12px}
        .logo{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;letter-spacing:0.5px;flex:0 0 40px}
        .title{font-size:15px;font-weight:650;line-height:1.2}
        .subtitle{font-size:12px;color:var(--muted);margin-top:3px}

        .card{background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 36px rgba(0,0,0,0.26);padding:16px}
        .section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
        .section-title strong{font-size:13px;letter-spacing:0.2px}
        .section-badge{font-size:12px;color:var(--muted)}

        .dropdown{position:relative;width:100%}
        .dropdown-trigger{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:11px;border:1px solid rgba(255,255,255,0.06);background:var(--card-2);color:var(--text);outline:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;font:inherit;text-align:left}
        .dropdown-trigger:focus{border-color:rgba(147,51,234,0.7);box-shadow:0 0 0 3px rgba(147,51,234,0.14)}
        .dropdown-trigger .dropdown-value{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .dropdown-chevron{color:var(--muted);font-size:12px;flex:0 0 auto}
        .dropdown-menu{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:20;background:#0b0f14;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 36px rgba(0,0,0,0.34);padding:6px;display:none;max-height:260px;overflow:auto}
        .dropdown.open-up .dropdown-menu{top:auto;bottom:calc(100% + 8px)}
        .dropdown.open .dropdown-menu{display:block}
        .dropdown-option{width:100%;box-sizing:border-box;padding:10px 12px;border:0;background:transparent;color:var(--text);border-radius:9px;cursor:pointer;text-align:left;font:inherit}
        .dropdown-option:hover,.dropdown-option[aria-selected="true"]{background:rgba(255,255,255,0.06)}
        .dropdown-option .option-secondary{display:block;font-size:11px;color:var(--muted);margin-top:3px}

        .field{display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:center;padding:10px 0}
        .field + .field{border-top:1px solid rgba(255,255,255,0.04)}
        .field label{font-size:13px;color:var(--muted)}
        .field input,.field select{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:11px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);color:var(--text);outline:none}
        .field input:focus,.field select:focus{border-color:rgba(147,51,234,0.7);box-shadow:0 0 0 3px rgba(147,51,234,0.14)}

        .hint{font-size:12px;color:var(--muted);margin-top:4px;margin-left:182px}
        .status-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:12px}
        .hidden-note{font-size:12px;color:var(--muted);margin:10px 0 0 182px}

        .row{display:flex;align-items:center;gap:10px}
        .row input[type="checkbox"]{width:16px;height:16px;accent-color:#7c3aed}
        .row label{color:var(--text);font-size:13px}

        .footer{display:flex;align-items:center;justify-content:flex-end;gap:12px}
        .btn{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:600}
        .btn.primary{color:#fff;background:linear-gradient(90deg,var(--accent1),var(--accent2));box-shadow:0 14px 28px rgba(79,70,229,0.2)}
        .toast{font-size:13px;color:#34d399;opacity:0;transition:opacity .25s}

        .muted{color:var(--muted)}

        @media (max-width: 720px){
            .field{grid-template-columns:1fr;gap:8px}
            .hint,.hidden-note{margin-left:0}
            .section-title{flex-direction:column;align-items:flex-start;gap:4px}
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="shell">
            <div class="header">
                <img src="ui/logo.png" alt="ReWrite Logo" id="app-logo" class="logo" style="width:40px;height:40px;border-radius:12px;object-fit:cover;box-shadow:0 6px 18px rgba(79,70,229,0.18);" />
                <div>
                    <div class="title" data-i18n="settings.title">ReWrite Cấu Hình</div>
                    <div class="subtitle" data-i18n="settings.subtitle">Quản lý API, hotkey và tùy chọn</div>
                </div>
            </div>

            <div class="card">
                <div class="section-title">
                    <strong data-i18n="settings.provider_section">AI Provider</strong>
                    <span class="section-badge" id="active-provider-label">Gemini</span>
                </div>

                <div class="field" style="padding-top:0">
                    <label data-i18n="settings.provider_label">Primary provider</label>
                    <div class="dropdown" data-dropdown="provider">
                        <input type="hidden" id="active-provider" value="gemini">
                        <button type="button" class="dropdown-trigger" id="active-provider-trigger" aria-haspopup="listbox" aria-expanded="false">
                            <span class="dropdown-value" id="active-provider-text">Gemini (Google)</span>
                            <span class="dropdown-chevron">▾</span>
                        </button>
                        <div class="dropdown-menu" id="active-provider-menu" role="listbox" aria-label="Provider options">
                            <button type="button" class="dropdown-option" data-value="gemini" data-label-key="provider.gemini" aria-selected="true">
                                <span data-i18n="provider.gemini">Gemini (Google)</span>
                            </button>
                            <button type="button" class="dropdown-option" data-value="openai" data-label-key="provider.openai" aria-selected="false">
                                <span data-i18n="provider.openai">OpenAI</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="hidden-note" data-i18n="settings.provider_hint">Only the selected provider's API key and model are shown.</div>

                <div id="gemini-panel">
                    <div class="field">
                        <label for="gemini-key" data-i18n="settings.gemini_key_label">Gemini API Key</label>
                        <input type="password" id="gemini-key" placeholder="Nhập Gemini API key của bạn..." data-i18n-placeholder="settings.gemini_key_placeholder">
                    </div>
                    <div class="field">
                        <label for="gemini-model" data-i18n="settings.gemini_model_label">Gemini Model</label>
                        <input type="text" id="gemini-model" value="gemini-1.5-flash" data-i18n-placeholder="settings.gemini_model_placeholder">
                    </div>
                </div>

                <div id="openai-panel" style="display:none">
                    <div class="field">
                        <label for="openai-key" data-i18n="settings.openai_key_label">OpenAI API Key</label>
                        <input type="password" id="openai-key" placeholder="Nhập OpenAI API key của bạn..." data-i18n-placeholder="settings.openai_key_placeholder">
                    </div>
                    <div class="field">
                        <label for="openai-model" data-i18n="settings.openai_model_label">OpenAI Model</label>
                        <input type="text" id="openai-model" value="gpt-4o-mini" data-i18n-placeholder="settings.openai_model_placeholder">
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="section-title">
                    <strong data-i18n="settings.workspace_section">Workspace</strong>
                    <span class="section-badge" data-i18n="settings.workspace_badge">Hotkey, language, startup</span>
                </div>

                <div class="field">
                    <label for="hotkey-input" data-i18n="settings.hotkey_label">Hotkey</label>
                    <div>
                        <input type="text" id="hotkey-input" placeholder="Nhấn tổ hợp phím để ghi nhận..." data-i18n-placeholder="settings.hotkey_placeholder">
                        <div class="hint" data-i18n="settings.hotkey_hint" style="margin-left:0;min-height:16px">Đặt con trỏ vào ô trên và nhấn tổ hợp phím mong muốn.</div>
                        <div id="hotkey-error" class="hint" style="margin-left:0;min-height:16px"></div>
                    </div>
                </div>

                <div class="field">
                    <label data-i18n="settings.language">Language</label>
                    <div class="dropdown" data-dropdown="locale">
                        <input type="hidden" id="select-locale" value="en">
                        <button type="button" class="dropdown-trigger" id="select-locale-trigger" aria-haspopup="listbox" aria-expanded="false">
                            <span class="dropdown-value" id="select-locale-text">English</span>
                            <span class="dropdown-chevron">▾</span>
                        </button>
                        <div class="dropdown-menu" id="select-locale-menu" role="listbox" aria-label="Language options">
                            <button type="button" class="dropdown-option" data-value="en" data-label-key="lang.en" aria-selected="true"><span data-i18n="lang.en">English</span></button>
                            <button type="button" class="dropdown-option" data-value="vi" data-label-key="lang.vi" aria-selected="false"><span data-i18n="lang.vi">Vietnamese</span></button>
                            <button type="button" class="dropdown-option" data-value="ja" data-label-key="lang.ja" aria-selected="false"><span data-i18n="lang.ja">Japanese (日本語)</span></button>
                            <button type="button" class="dropdown-option" data-value="zh-CN" data-label-key="lang.zh-CN" aria-selected="false"><span data-i18n="lang.zh-CN">Chinese Simplified (简体中文)</span></button>
                            <button type="button" class="dropdown-option" data-value="zh-TW" data-label-key="lang.zh-TW" aria-selected="false"><span data-i18n="lang.zh-TW">Chinese Traditional (繁體中文)</span></button>
                            <button type="button" class="dropdown-option" data-value="fr" data-label-key="lang.fr" aria-selected="false"><span data-i18n="lang.fr">French (Français)</span></button>
                            <button type="button" class="dropdown-option" data-value="de" data-label-key="lang.de" aria-selected="false"><span data-i18n="lang.de">German (Deutsch)</span></button>
                            <button type="button" class="dropdown-option" data-value="ko" data-label-key="lang.ko" aria-selected="false"><span data-i18n="lang.ko">Korean (한국어)</span></button>
                        </div>
                    </div>
                </div>

                <div class="field" style="padding-bottom:0">
                    <label data-i18n="settings.autostart">Start with Windows</label>
                    <div class="row">
                        <input id="system-startup" type="checkbox" checked>
                    </div>
                </div>
            </div>

            <div class="footer">
                <div id="settings-toast" class="toast" data-i18n="settings.save_notice">Đã lưu cài đặt thành công!</div>
                <button id="save-settings-btn" class="btn primary" data-i18n="button.save_settings">Save settings</button>
            </div>
        </div>
    </div>
    <script src="settings.js"></script>
</body>

</html>
