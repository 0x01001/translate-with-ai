<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="title.popup">ReWrite Assistant</title>
    <link rel="stylesheet" href="https://rewrite.local/tailwind.css">
    <style>
        /* PANEL */
        .result-panel {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            transition: box-shadow 0.6s ease-in-out;
        }

        /* flex ai-output loadding */
        .ai-output-loading {
            position: relative;
            width: 100%;
            height: 150px;
        }

        /* Ambient breathing shadow during thinking state */
        .result-panel.loading {
            animation: pulseGlow 2.5s infinite ease-in-out;
        }

        /* Seamless premium glow ring */
        .result-panel.loading::before {
            content: "";
            position: absolute;
            width: 260%;
            height: 260%;
            left: -80%;
            top: -80%;
            background: conic-gradient(from 0deg,
                    #6366f1 0%,
                    #a855f7 20%,
                    #ec4899 40%,
                    #06b6d4 60%,
                    #3b82f6 80%,
                    #6366f1 100%);
            animation: borderSpin 3s linear infinite;
            z-index: 1;
        }

        /* Inner mask */
        .result-panel.loading::after {
            content: "";
            position: absolute;
            inset: 1.5px;
            border-radius: 10.5px;
            background: #0f1115;
            z-index: 2;
        }

        /* Elevate contents above the mask layers */
        .result-panel>* {
            position: relative;
            z-index: 3;
        }

        @keyframes borderSpin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulseGlow {

            0%,
            100% {
                box-shadow: 0 0 12px rgba(99, 102, 241, 0.12), 0 0 24px rgba(236, 72, 153, 0.04);
            }

            50% {
                box-shadow: 0 0 22px rgba(99, 102, 241, 0.28), 0 0 38px rgba(6, 182, 212, 0.15);
            }
        }
    </style>
</head>

                                <select

                                    <option value="casual" data-i18n="tone.casual">Thân thiện, gần gũi</option>

                                    <option value="bullets" data-i18n="format.bullets">Danh sách</option>
                                    <option value="email" data-i18n="format.email">Thư điện tử (Email)</option>
                                    <option value="short" data-i18n="format.short">Tin nhắn ngắn</option>

                        <option value="Tiếng Đức" data-i18n="lang.de">Tiếng Đức (Deutsch)</option>

                            <path fill="currentColor"
