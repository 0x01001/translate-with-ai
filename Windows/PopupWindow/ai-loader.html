<style>
    .demo-bg {
        position: absolute;

        width: 100%;
        height: 340px;

        left: 0;
        top: 50%;
        transform: translateY(-50%);

        display: flex;
        align-items: center;
        justify-content: center;

        background: #0a0a12;

        overflow: hidden;
    }

    .bg-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.18;
        animation: orb-drift 8s ease-in-out infinite alternate;
    }

    .bg-orb-1 {
        width: 260px;
        height: 260px;
        background: #471eec;
        top: -60px;
        left: -40px;
        animation-delay: 0s;
    }

    .bg-orb-2 {
        width: 200px;
        height: 200px;
        background: #d60a47;
        bottom: -50px;
        right: -30px;
        animation-delay: -3s;
    }

    .bg-orb-3 {
        width: 160px;
        height: 160px;
        background: #ad5fff;
        top: 30%;
        left: 55%;
        animation-delay: -6s;
    }

    @keyframes orb-drift {
        from {
            transform: translate(0, 0) scale(1);
        }

        to {
            transform: translate(20px, 15px) scale(1.1);
        }
    }

    .loader-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        pointer-events: none;
        font-family: "Inter", sans-serif;
        font-size: 1rem;
        font-weight: 500;
        color: white;
        user-select: none;
        z-index: 1;
    }

    .loader-ring-outer {
        position: absolute;
        width: 128px;
        height: 128px;
        border-radius: 50%;
        border: 1.5px solid rgba(173, 95, 255, 0.15);
        animation: ring-pulse 3s ease-in-out infinite;
    }

    .loader-ring-outer-2 {
        position: absolute;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        border: 1px solid rgba(71, 30, 236, 0.1);
        animation: ring-pulse 3s ease-in-out infinite 0.6s;
    }

    @keyframes ring-pulse {

        0%,
        100% {
            opacity: 0.4;
            transform: scale(1);
        }

        50% {
            opacity: 1;
            transform: scale(1.04);
        }
    }

    .loader {
        position: absolute;
        width: 90px;
        height: 90px;
        aspect-ratio: 1 / 1;
        border-radius: 999px;
        background-color: transparent;
        filter: blur(0.2px);
        animation: loader-rotate 2s linear infinite;
        z-index: 0;
    }

    @keyframes loader-rotate {
        0% {
            transform: rotate(90deg);
            box-shadow: 0 10px 20px 0 #fff inset, 0 20px 30px 0 #ad5fff inset, 0 60px 60px 0 #471eec inset;
        }

        50% {
            transform: rotate(270deg);
            box-shadow: 0 10px 20px 0 #fff inset, 0 20px 10px 0 #d60a47 inset, 0 40px 60px 0 #311e80 inset;
        }

        100% {
            transform: rotate(450deg);
            box-shadow: 0 10px 20px 0 #fff inset, 0 20px 30px 0 #ad5fff inset, 0 60px 60px 0 #471eec inset;
        }
    }

    .loader-glow {
        position: absolute;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(173, 95, 255, 0.18) 0%, transparent 70%);
        animation: glow-breathe 2s ease-in-out infinite;
        z-index: 0;
    }

    @keyframes glow-breathe {

        0%,
        100% {
            transform: scale(1);
            opacity: 0.6;
        }

        50% {
            transform: scale(1.5);
            opacity: 1;
        }
    }

    .arc-sweep {
        position: absolute;
        width: 104px;
        height: 104px;
        border-radius: 50%;
        border: 1.5px solid transparent;
        border-top-color: rgba(173, 95, 255, 0.6);
        border-right-color: rgba(214, 10, 71, 0.3);
        animation: arc-spin 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        z-index: 1;
    }

    @keyframes arc-spin {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    .loader-text {
        position: absolute;
        z-index: 2;
        display: flex;
        gap: 0px;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
    }

    .loader-letter {
        display: inline-block;
        opacity: 0.35;
        animation: loader-letter-anim 2s infinite;
    }

    .loader-letter:nth-child(1) {
        animation-delay: 0s;
    }

    .loader-letter:nth-child(2) {
        animation-delay: 0.1s;
    }

    .loader-letter:nth-child(3) {
        animation-delay: 0.2s;
    }

    .loader-letter:nth-child(4) {
        animation-delay: 0.3s;
    }

    .loader-letter:nth-child(5) {
        animation-delay: 0.4s;
    }

    .loader-letter:nth-child(6) {
        animation-delay: 0.5s;
    }

    .loader-letter:nth-child(7) {
        animation-delay: 0.6s;
    }

    .loader-letter:nth-child(8) {
        animation-delay: 0.7s;
    }

    .loader-letter:nth-child(9) {
        animation-delay: 0.8s;
    }

    .loader-letter:nth-child(10) {
        animation-delay: 0.9s;
    }

    @keyframes loader-letter-anim {

        0%,
        100% {
            opacity: 0.35;
            transform: translateY(0) scale(1);
            text-shadow: none;
        }

        20% {
            opacity: 1;
            transform: translateY(-1px) scale(1.1);
            text-shadow: 0 0 10px rgba(173, 95, 255, 0.9), 0 0 20px rgba(71, 30, 236, 0.5);
        }

        40% {
            opacity: 0.7;
            transform: translateY(0) scale(1);
        }
    }

    .dots-row {
        position: absolute;
        bottom: -58px;
        display: flex;
        gap: 6px;
        align-items: center;
    }

    .dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(173, 95, 255, 0.5);
        animation: dot-bounce 1.4s ease-in-out infinite;
    }

    .dot:nth-child(1) {
        animation-delay: 0s;
    }

    .dot:nth-child(2) {
        animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes dot-bounce {

        0%,
        80%,
        100% {
            transform: scale(1);
            opacity: 0.4;
        }

        40% {
            transform: scale(1.6);
            opacity: 1;
            background: #ad5fff;
        }
    }
</style>

<div class="demo-bg">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="loader-wrapper">
        <div class="loader-ring-outer-2"></div>
        <div class="loader-ring-outer"></div>
        <div class="arc-sweep"></div>
        <div class="loader-glow"></div>
        <div class="loader"></div>

        <div class="loader-text">
            <span class="loader-letter">G</span>
            <span class="loader-letter">e</span>
            <span class="loader-letter">n</span>
            <span class="loader-letter">e</span>
            <span class="loader-letter">r</span>
            <span class="loader-letter">a</span>
            <span class="loader-letter">t</span>
            <span class="loader-letter">i</span>
            <span class="loader-letter">n</span>
            <span class="loader-letter">g</span>
        </div>

        <div class="dots-row">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
</div>
