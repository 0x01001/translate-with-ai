<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ReWrite Tutorial</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="tutorial-shell">
        <header class="tutorial-header">
            <div class="logo">
                <img class="logo-mark" src="logo.png" alt="ReWrite logo">
                <div>
                    <div class="tutorial-title">Huong dan su dung ReWrite</div>
                    <div class="tutorial-subtitle">Xem video gioi thieu nhanh ve cac tinh nang chinh.</div>
                </div>
            </div>
            <button class="action-btn secondary" id="btn-close-header">Dong</button>
        </header>

        <section class="tutorial-body">
            <div class="video-frame">
                <iframe
                    id="tutorial-video"
                    title="ReWrite tutorial video"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
                <div class="video-placeholder" id="video-placeholder">
                    <div class="video-placeholder-title">Chua gan video</div>
                    <div class="video-placeholder-subtitle">Ban co the gan link YouTube embed qua query ?video=... hoac localStorage.</div>
                </div>
            </div>
        </section>

        <footer class="tutorial-actions">
            <button class="action-btn secondary" id="btn-skip">De sau</button>
            <button class="action-btn primary" id="btn-close">Bat dau dung ReWrite</button>
        </footer>
    </div>

    <script src="tutorial.js"></script>
</body>
</html>
